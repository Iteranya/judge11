<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐳 Judge Test Playground</title>
    <!-- Ace Editor via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.36.2/ace.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Fira Code', 'Consolas', monospace; background: #1a1a2e; color: #eee; height: 100vh; display: flex; flex-direction: column; }
        .header { background: #16213e; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #e94560; }
        .header h1 { font-size: 1.1rem; color: #e94560; }
        .header span { font-size: 0.75rem; color: #888; }
        .main { display: flex; flex: 1; overflow: hidden; }
        .panel { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #333; }
        .panel:last-child { border-right: none; }
        .panel-header { background: #16213e; padding: 8px 16px; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: #999; }
        .panel-header .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
        .dot.red { background: #e94560; }
        .dot.green { background: #4ecca3; }
        #editor { flex: 1; font-size: 0.85rem; line-height: 1.6; }
        #output { flex: 1; background: #0f0f23; color: #ccc; padding: 16px; font-size: 0.85rem; overflow-y: auto; white-space: pre-wrap; line-height: 1.6; }
        .btn-row { padding: 10px 20px; background: #16213e; border-top: 1px solid #333; display: flex; gap: 10px; align-items: center; }
        button { padding: 8px 20px; border: none; border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 0.8rem; font-weight: bold; transition: 0.2s; }
        #runBtn { background: #e94560; color: #fff; }
        #runBtn:hover { background: #ff6b81; }
        #runBtn:disabled { background: #555; cursor: not-allowed; }
        #status { font-size: 0.75rem; color: #888; margin-left: auto; }
        .verdict-ac { color: #4ecca3; font-weight: bold; }
        .verdict-err { color: #e94560; font-weight: bold; }
        .timing-info { font-size: 0.8rem; color: #ffb347; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🐳 Judge Test Playground</h1>
        <span id="endpoint">POST /test</span>
    </div>
    <div class="main">
        <div class="panel">
            <div class="panel-header"><span class="dot red"></span> C++ Code</div>
            <div id="editor">#include <iostream>
int main() {
    std::cout << "Hello World!" << std::endl;
    return 0;
}</div>
        </div>
        <div class="panel">
            <div class="panel-header"><span class="dot green"></span> Output</div>
            <div id="output">// Click "Run" to test the judge~ ✨</div>
        </div>
    </div>
    <div class="btn-row">
        <button id="runBtn" onclick="runCode()">▶ Run (Ctrl+Enter)</button>
        <span id="status">Ready</span>
    </div>

    <script>
        // Initialize Ace Editor
        const editor = ace.edit("editor");
        editor.setTheme("ace/theme/monokai");
        editor.session.setMode("ace/mode/c_cpp");
        editor.setOptions({
            fontSize: "0.85rem",
            showPrintMargin: false,
            enableBasicAutocompletion: true,
            enableLiveAutocompletion: true,
            enableSnippets: true
        });
        editor.setValue(`#include <iostream>
int main() {
    std::cout << "Hello World!" << std::endl;
    return 0;
}`);
        editor.clearSelection();

        // Ctrl+Enter shortcut
        editor.container.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                e.preventDefault();
                runCode();
            }
        });

        const output = document.getElementById('output');
        const status = document.getElementById('status');
        const runBtn = document.getElementById('runBtn');

        function formatTiming(data) {
            let lines = [];
            if (data.compile_ms !== undefined && data.compile_ms !== null) {
                lines.push(`⏱ Compile: ${data.compile_ms} ms`);
            }
            if (data.run_ms !== undefined && data.run_ms !== null) {
                lines.push(`⚡ Run: ${data.run_ms} ms`);
            }
            if (data.elapsed_ms !== undefined && data.elapsed_ms !== null) {
                lines.push(`🕐 Total elapsed: ${data.elapsed_ms} ms`);
            }
            return lines.join('  |  ');
        }

        async function runCode() {
            const code = editor.getValue();
            if (!code.trim()) return;

            runBtn.disabled = true;
            status.textContent = 'Compiling...';
            output.textContent = '';

            try {
                const res = await fetch('/test', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code }),
                });
                const data = await res.json();

                // Build timing info string
                const timingInfo = `<div class="timing-info">${formatTiming(data)}</div>`;

                if (data.status === 'ok') {
                    output.innerHTML =
                        `<span class="verdict-ac">✓ Compiled & Ran Successfully</span>\n\n` +
                        escapeHtml(data.stdout) +
                        (data.stderr ? `\n\n<span class="verdict-err">[stderr]</span>\n${escapeHtml(data.stderr)}` : '') +
                        timingInfo;
                    status.textContent = `Done (exit ${data.exit_code})`;
                } else if (data.status === 'compile_error') {
                    output.innerHTML =
                        `<span class="verdict-err">✗ Compilation Error</span>\n\n` +
                        escapeHtml(data.stderr || data.message || '') +
                        timingInfo;
                    status.textContent = 'Compile Error';
                } else if (data.status === 'compile_timeout') {
                    output.innerHTML =
                        `<span class="verdict-err">⏱ Compilation Timeout</span>\n\n${data.message}` +
                        timingInfo;
                    status.textContent = 'Compile Timeout';
                } else if (data.status === 'timeout') {
                    output.innerHTML =
                        `<span class="verdict-err">⏱ Runtime Timeout</span>\n\n${data.message}\n${data.stdout ? escapeHtml(data.stdout) : ''}` +
                        (data.stderr ? `\n\n<span class="verdict-err">[stderr]</span>\n${escapeHtml(data.stderr)}` : '') +
                        timingInfo;
                    status.textContent = 'Timeout';
                } else if (data.status === 'runtime_error') {
                    output.innerHTML =
                        `<span class="verdict-err">💥 Runtime Error</span>\n\n${data.message}` +
                        (data.stdout ? `\n\n${escapeHtml(data.stdout)}` : '') +
                        (data.stderr ? `\n\n${escapeHtml(data.stderr)}` : '') +
                        timingInfo;
                    status.textContent = `Runtime Error (exit ${data.exit_code || '?'})`;
                } else if (data.status === 'system_error') {
                    output.innerHTML =
                        `<span class="verdict-err">⚠️ System Error</span>\n\n${escapeHtml(data.message)}` +
                        timingInfo;
                    status.textContent = 'System Error';
                } else {
                    output.innerHTML = `<span class="verdict-err">Unknown response</span>\n\n${JSON.stringify(data, null, 2)}`;
                    status.textContent = 'Unknown';
                }
            } catch (err) {
                output.innerHTML = `<span class="verdict-err">✗ Connection Error</span>\n\n${escapeHtml(err.message)}`;
                status.textContent = 'Error';
            } finally {
                runBtn.disabled = false;
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, '&').replace(/</g, '<').replace(/>/g, '>');
        }
    </script>
</body>
</html>
